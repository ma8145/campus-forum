name: 自动解压源码
on:
  push:
    paths:
      - '*.yml'
  workflow_dispatch:
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 解压文件
        run: |
          set +e
          echo "=== 当前目录内容 ==="
          ls -la
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "没有找到 zip 文件"
            exit 0
          fi
          echo "=== 找到压缩包: $ZIP_FILE ==="
          unzip -o "$ZIP_FILE"
          echo "=== 解压后内容 ==="
          ls -la
          if [ -d "campus-forum-deploy" ]; then
            echo "=== 移动文件到根目录 ==="
            find campus-forum-deploy -mindepth 1 -maxdepth 1 -exec mv {} . \;
            rm -rf campus-forum-deploy
          fi
          rm -f "$ZIP_FILE"
          echo "=== 最终内容 ==="
          ls -la
      - name: 提交到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "自动解压源码文件" || echo "无变化"
          git push
